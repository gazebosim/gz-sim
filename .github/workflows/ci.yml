name: Ubuntu CI

on:
  pull_request:
  push:
    branches:
      - 'ign-gazebo[0-9]'
      - 'gz-sim[1-9]?[0-9]'
      - 'main'

# Every time you make a push to your PR, it cancel immediately the previous checks,
# and start a new one. The other runner will be available more quickly to your PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  resolute-ci:
    runs-on: ubuntu-latest
    strategy:
      # A Zenoh failure must not cancel the ZeroMQ run, and vice versa
      fail-fast: false
      matrix:
        transport: [zeromq, zenoh]
    # Keep "Ubuntu Resolute CI" for ZeroMQ, it is a required status check
    name: Ubuntu Resolute CI${{ matrix.transport == 'zenoh' && ' (Zenoh)' || '' }}
    env:
      GZ_TRANSPORT_IMPLEMENTATION: ${{ matrix.transport }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: matrix.transport == 'zeromq'
      - uses: pre-commit/action@v3.0.1
        if: matrix.transport == 'zeromq'
        with:
          extra_args: --all-files
      - name: Compile and test
        id: ci
        uses: gazebo-tooling/action-gz-ci@resolute
        with:
          gzdev-project-name: rotary
          # per bug https://github.com/gazebosim/gz-sim/issues/1409
          cmake-args: '-DCMAKE_INSTALL_PREFIX=/usr -DBUILD_DOCS=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo'
      # The marker is written by .github/ci/before_cmake.sh inside the
      # container. Without it, the tests ran with the default ZeroMQ backend.
      - name: Check that the tests used Zenoh
        if: ${{ !cancelled() && matrix.transport == 'zenoh' }}
        run: |
          if [ "$(cat build/gz_transport_implementation.txt 2>/dev/null)" != "zenoh" ]; then
            echo "::error::No Zenoh marker from before_cmake.sh, the tests did not run with Zenoh"
            exit 1
          fi

  resolute-ci-disable-gui:
    runs-on: ubuntu-latest
    name: Ubuntu Resolute CI (GUI disabled)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - name: Compile and test
        id: ci
        uses: gazebo-tooling/action-gz-ci@resolute
        with:
          gzdev-project-name: rotary
          # per bug https://github.com/gazebosim/gz-sim/issues/1409
          cmake-args: '-DCMAKE_INSTALL_PREFIX=/usr -DBUILD_DOCS=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_GUI=OFF'
          cppcheck-enabled: true
          cpplint-enabled: true
