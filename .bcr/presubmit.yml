matrix:
  platform:
  - ubuntu2404
  - macos_arm64
  # Disabled due to https://github.com/bazel-contrib/rules_foreign_cc/issues/1305.
  # rules_foreign_cc is transitively pulled in through libzmq.
  # - macos_arm64
  bazel:
  - 9.x
  - 8.x
  - 7.x # Remove after Q4 2026: https://bazel.build/release#support-matrix
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--cxxopt=-std=c++17'
    - '--host_cxxopt=-std=c++17'
    build_targets:
    - '@gz-sim'
